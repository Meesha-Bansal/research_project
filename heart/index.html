<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Explorer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app-shell">
    <div id="languageSwitcher" class="language-switcher" aria-label="Language switcher">
      <button class="lang-btn is-active" type="button" data-lang="en">English</button>
      <button class="lang-btn" type="button" data-lang="hi">हिंदी</button>
      <button class="lang-btn" type="button" data-lang="pa">ਪੰਜਾਬੀ</button>
    </div>

    <section id="viewer" class="viewer">
      <canvas id="sceneCanvas" aria-label="3D heart viewer"></canvas>
      <div id="heartSafeZone" class="heart-safe-zone" aria-hidden="true"></div>
      <div id="hotspotLayer" class="hotspot-layer" aria-hidden="false"></div>

      <div id="overlay" class="overlay" role="status" aria-live="polite">
        <div id="overlayText" class="overlay-text">Booting 3D heart viewer...</div>
      </div>

      <aside id="labelCard" class="chamber-card is-hidden" aria-live="polite" aria-labelledby="chamberTitle">
        <button id="closeCardBtn" class="card-close" type="button" aria-label="Close card">Close</button>
        <button class="corner-action corner-action-left" type="button" aria-label="Open menu">
          <span class="corner-symbol">+</span>
        </button>
        <button class="corner-action corner-action-right" type="button" aria-label="Save favorite">
          <span class="corner-symbol">*</span>
        </button>

        <header class="card-header">
          <h2 id="cardCategory">Receiving Chamber</h2>
        </header>

        <div class="card-body">
          <section class="hero-panel">
            <div class="heart-badge" aria-hidden="true">
              <svg viewBox="0 0 140 140" class="heart-illustration" role="img">
                <path d="M70 119c-4-5-14-14-25-24C24 76 14 64 14 44c0-19 14-31 30-31 12 0 20 7 26 15 6-8 14-15 26-15 16 0 30 12 30 31 0 20-10 32-31 51-11 10-21 19-25 24Z" fill="#ff5a59" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
                <path d="M39 56c0-10 7-18 17-18 7 0 11 4 14 9 3-5 7-9 14-9 10 0 17 8 17 18 0 11-5 18-17 29-6 5-11 10-14 13-3-3-8-8-14-13-12-11-17-18-17-29Z" fill="#ff8e8f"/>
                <circle cx="22" cy="58" r="10" fill="#ff4a4f" stroke="#111" stroke-width="5"/>
                <circle cx="118" cy="58" r="10" fill="#ff4a4f" stroke="#111" stroke-width="5"/>
                <circle cx="54" cy="50" r="11" fill="#fff" stroke="#111" stroke-width="4"/>
                <circle cx="86" cy="50" r="11" fill="#fff" stroke="#111" stroke-width="4"/>
                <circle cx="56" cy="53" r="4.5" fill="#111"/>
                <circle cx="84" cy="53" r="4.5" fill="#111"/>
                <circle cx="58" cy="50" r="1.7" fill="#fff"/>
                <circle cx="86" cy="50" r="1.7" fill="#fff"/>
                <path d="M59 71c7 7 15 7 22 0" fill="none" stroke="#111" stroke-width="4.5" stroke-linecap="round"/>
                <path d="M62 64h16" stroke="#111" stroke-width="4.5" stroke-linecap="round"/>
              </svg>
            </div>

            <div class="hero-copy">
              <h3 id="chamberTitle">Right Atrium</h3>
              <p id="chamberDescription">Receives deoxygenated blood from the body</p>
            </div>
          </section>

          <section class="quiz-panel" aria-labelledby="quizPrompt">
            <p id="quizPrompt" class="quiz-title"><span aria-hidden="true">&#9889;</span> Oxygen level here?</p>

            <div class="choice-row" role="group" aria-label="Oxygen level choices">
              <button class="answer-btn" type="button" data-answer="low" aria-pressed="false">
                <span class="answer-check" aria-hidden="true">&#10003;</span>
                <span>Low</span>
              </button>
              <button class="answer-btn" type="button" data-answer="high" aria-pressed="false">
                <span>High</span>
              </button>
            </div>

            <p class="feedback-box is-neutral" id="feedbackBox" aria-live="polite">
              Pick an answer to check the oxygen level for this label.
            </p>
          </section>
        </div>

        <div class="pop-tag" aria-hidden="true">POP!</div>
      </aside>
    </section>

    <button id="videoOpenButton" class="video-button" type="button">Open Video</button>
  </main>

  <div id="videoOverlay" class="video-overlay is-hidden" aria-hidden="true">
    <div class="video-dialog">
      <button id="videoCloseButton" class="video-close" type="button" aria-label="Close video">Close</button>
      <video
        id="heartVideo"
        class="heart-video"
        controls
        preload="metadata"
        controlsList="nodownload noplaybackrate noremoteplayback"
        disablePictureInPicture
        playsinline
      ></video>

      <div class="video-controls">
        <button id="videoPlayPauseBtn" type="button">Play / Pause</button>
        <button id="videoRewindBtn" type="button">-10s</button>
        <button id="videoForwardBtn" type="button">+10s</button>
        <button class="video-speed-btn is-active" type="button" data-rate="1">1x</button>
        <button class="video-speed-btn" type="button" data-rate="1.5">1.5x</button>
        <button class="video-speed-btn" type="button" data-rate="2">2x</button>
      </div>
    </div>
  </div>

  <script type="module" src="/script.js"></script>
</body>
</html>
